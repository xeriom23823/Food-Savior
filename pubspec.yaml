name: food_savior
description: "A flutter project to help reduce food waste"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  authentication_repository:
    path: packages/authentication_repository
  form_inputs:
    path: packages/form_inputs
  intl: ^0.20.3
  intl_utils: ^2.8.15
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  firebase_core: ^4.15.0
  shared_preferences: ^2.5.5
  curved_labeled_navigation_bar: ^2.0.6
  flutter_slidable: ^4.0.3
  meta: ^1.19.0
  formz: ^0.8.1
  font_awesome_flutter: ^11.0.0
  flow_builder: ^0.1.0
  lottie: ^3.5.1
  uuid: ^4.6.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  fl_chart: ^1.2.0
  path_provider: ^2.1.6
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  hive_ce_generator: ^1.11.2
  build_runner: ^2.15.1
  mockito: ^5.6.4
  fake_cloud_firestore: ^4.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/food_savior_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Regular.otf
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Bold.otf
          weight: 700
dependency_overrides:
  objective_c: 9.6.0

flutter_intl:
  enabled: true
  class_name: S
  main_locale: zh
  arb_dir: lib/l10n
  output_dir: lib/generated
