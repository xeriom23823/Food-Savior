name: food_savior
description: "A flutter project to help reduce food waste"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  authentication_repository:
    path: packages/authentication_repository
  form_inputs:
    path: packages/form_inputs
  intl: ^0.19.0
  intl_utils: ^2.8.7
  image_cropper: ^9.1.0
  image_picker: ^1.0.7
  dotted_border: ^2.1.0
  cupertino_icons: ^1.0.6
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  material_design_icons_flutter: ^7.0.7296
  firebase_core: ^3.13.0
  shared_preferences: ^2.2.3
  # MCP 相關依賴
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.1.0
  json_annotation: ^4.8.1
  clipboard: ^0.1.3
  # 其他已有的依賴
  curved_labeled_navigation_bar: ^2.0.5
  flutter_slidable: ^4.0.0
  test: ^1.24.9
  meta: ^1.15.0
  formz: ^0.8.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flow_builder: ^0.1.0
  lottie: ^3.1.3
  uuid: ^4.5.1
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  fl_chart: ^0.70.2
  path_provider: ^2.1.5
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  intl_translation: ^0.20.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.1
  hive_ce_generator: ^1.8.0
  build_runner: ^2.4.13
  mockito: ^5.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/food_savior_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Regular.otf
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Bold.otf
          weight: 700