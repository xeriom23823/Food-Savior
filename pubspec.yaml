name: food_savior
description: "A flutter project to help reduce food waste"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  authentication_repository:
    path: packages/authentication_repository
  form_inputs:
    path: packages/form_inputs
  intl: ^0.20.0
  intl_utils: ^2.8.7
  image_cropper: ^11.0.0
  image_picker: ^1.2.0
  dotted_border: ^3.1.0
  cupertino_icons: ^1.0.6
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  material_design_icons_flutter: ^7.0.7296
  firebase_core: ^3.15.2
  shared_preferences: ^2.2.3
  curved_labeled_navigation_bar: ^2.0.5
  flutter_slidable: ^4.0.3
  test: ^1.24.9
  meta: ^1.15.0
  formz: ^0.8.0
  google_fonts: ^6.3.2
  font_awesome_flutter: ^10.10.0
  flow_builder: ^0.1.0
  lottie: ^3.3.2
  uuid: ^4.5.1
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  fl_chart: ^1.1.1
  path_provider: ^2.1.5
  hive_ce: ^2.14.0
  hive_ce_flutter: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  intl_translation: ^0.20.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  hive_ce_generator: ^1.4.0
  build_runner: ^2.4.13
  mockito: ^5.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/food_savior_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Regular.otf
        - asset: assets/fonts/NotoSansTC/NotoSansTC-Bold.otf
          weight: 700