org.gradle.jvmargs=-Xmx4G --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=false
# AGP 9 內建 Kotlin 編譯（取代 Kotlin Gradle Plugin）。
# 設為 false 會讓 app 與 firebase_core／firebase_auth 退回套用 KGP，Flutter 3.47 會發出棄用警告。
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# ML Kit 條碼模型改由 Google Play Services 動態下載，不打包進 APK
# （unbundled-scanner-model D1）。打包版本實測佔約 14.3 MB。
# 搭配 AndroidManifest 的 com.google.mlkit.vision.DEPENDENCIES，模型在安裝時就備妥。
dev.steenbakker.mobile_scanner.useUnbundled=true
