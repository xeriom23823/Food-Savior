name: authentication_repository
description: Dart package which manages the authentication domain.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # StreamGroup：user 串流要把 authStateChanges 與 profile 更新合流（design D5）。
  async: ^2.13.0
  cache:
    path: ../cache
  equatable: ^2.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  meta: ^1.19.0

dev_dependencies:
  firebase_auth_platform_interface: ^9.1.0
  firebase_core_platform_interface: ^8.1.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8